def getCapacitorAndroidDir() {
    try {
        def proc = ["node", "-e", "console.log(require('path').dirname(require.resolve('@capacitor/android/package.json')) + '/capacitor')"].execute(null, new File(rootDir, '..'))
        proc.waitFor()
        def out = proc.text.trim()
        if (out && new File(out).exists()) return new File(out)
    } catch (Exception ignored) {}
    return new File(rootDir, '../../../node_modules/.pnpm/@capacitor+android@8.5.2_@capacitor+core@8.5.2/node_modules/@capacitor/android/capacitor')
}

include ':capacitor-android'
project(':capacitor-android').projectDir = getCapacitorAndroidDir()
