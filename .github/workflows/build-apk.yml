name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  release:
    types: [created, published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Application
        run: pnpm --filter @workspace/mockup-sandbox run build

      - name: Sync Assets to Android
        run: |
          mkdir -p artifacts/mockup-sandbox/android/app/src/main/assets/public
          cp -r artifacts/mockup-sandbox/dist/* artifacts/mockup-sandbox/android/app/src/main/assets/public/

      - name: Make Gradle executable
        run: chmod +x artifacts/mockup-sandbox/android/gradlew

      - name: Build Debug APK
        run: |
          cd artifacts/mockup-sandbox/android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK for Release
        run: |
          cp artifacts/mockup-sandbox/android/app/build/outputs/apk/debug/app-debug.apk artifacts/mockup-sandbox/android/app/build/outputs/apk/debug/WakeUp-AI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WakeUp-AI-apk
          path: artifacts/mockup-sandbox/android/app/build/outputs/apk/debug/WakeUp-AI.apk
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/mockup-sandbox/android/app/build/outputs/apk/debug/WakeUp-AI.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
